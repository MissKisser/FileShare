# FileShare Nginx 参考配置（M2/M3 配套）
# 本文件提供生产环境部署 Nginx 时的安全配置参考，特别是禁止 uploads/ 目录
# 的 PHP 执行（防止用户上传的脚本文件被服务器解析执行造成 RCE）。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # HTTPS 重定向（生产环境推荐）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # SSL 证书（按实际路径替换）
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    root /var/www/fileshare;
    index index.php;

    # 上传大小限制（业务层 2GB，Nginx 层同样放开）
    client_max_body_size 2048M;

    # ============================================================
    # 安全：uploads/ 目录禁止任何脚本执行
    # 即使应用层白名单漏过 .php5 / shell.phtml，Nginx 层也会拦截
    # ============================================================
    location /uploads/ {
        # 禁止 PHP 文件被 fastcgi 处理
        location ~ \.(php|phtml|php[3-7]|pht|phar|cgi|pl|py|sh)$ {
            deny all;
            return 403;
        }
        # 关闭目录列表
        autoindex off;
        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ============================================================
    # 安全：storage/ 目录完全禁止 web 访问（含 SQLite db）
    # ============================================================
    location /storage/ {
        deny all;
        return 403;
    }

    # 隐藏敏感文件
    location ~ /\.(env|git|htaccess|user\.ini) {
        deny all;
        return 403;
    }
    location ~ /(composer\.(json|lock)|phpunit\.xml|\.gitignore) {
        deny all;
        return 403;
    }

    # ============================================================
    # PHP-FPM 处理（仅 index.php 入口，所有路由统一走这里）
    # ============================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # 仅信任 index.php 作为入口（其他 PHP 文件不能直接访问）
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # 上传大文件超时
        fastcgi_read_timeout 7200;
        fastcgi_send_timeout 7200;
        fastcgi_request_buffering off; # 大文件流式上传
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
